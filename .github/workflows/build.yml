# Builds FreeX TV: the Android TV / Fire TV APK, the Samsung (Tizen) project (signed .wgt when the
# Samsung certificate is in the secrets) and the LG (webOS) package. Releases are made by
# release.yml, which calls this workflow for the release commit.
#
# Secrets (all optional):
#   FREEX_KEYSTORE_BASE64, FREEX_KEYSTORE_PASSWORD, FREEX_KEY_ALIAS, FREEX_KEY_PASSWORD
#       release key for the APK (otherwise the debug key signs)
#   TIZEN_AUTHOR_P12_BASE64, TIZEN_AUTHOR_PASSWORD, TIZEN_DISTRIBUTOR_P12_BASE64, TIZEN_DISTRIBUTOR_PASSWORD
#       Samsung certificate profile (author.p12 and distributor.p12 from tizen-studio-data/keystore)
#       for the signed .wgt; it installs only on the TVs whose DUID is in the distributor certificate
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (ES2017, Samsung TVs from 2018 on)
        run: |
          npm install --no-save acorn@8
          node -e '
            const acorn = require("acorn"), fs = require("fs");
            for (const f of fs.readdirSync("web/js")) {
              acorn.parse(fs.readFileSync("web/js/" + f, "utf8"), {ecmaVersion: 2017});
              console.log("ok", f);
            }'

  android:
    name: Android TV / Fire TV
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FREEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/freex.jks"
            echo "FREEX_KEYSTORE=$RUNNER_TEMP/freex.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          FREEX_KEYSTORE_PASSWORD: ${{ secrets.FREEX_KEYSTORE_PASSWORD }}
          FREEX_KEY_ALIAS: ${{ secrets.FREEX_KEY_ALIAS }}
          FREEX_KEY_PASSWORD: ${{ secrets.FREEX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' web/version.json)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FreeX-TV-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-android
          path: dist/*.apk

  tizen:
    name: Samsung (Tizen)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Samsung certificate
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          if [ -z "$AUTHOR_P12" ] || [ -z "$DISTRIBUTOR_P12" ]; then
            echo "No Samsung certificate in the secrets: only the project archive is built."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/tizen-keys"
          echo "$AUTHOR_P12" | base64 -d > "$RUNNER_TEMP/tizen-keys/author.p12"
          echo "$DISTRIBUTOR_P12" | base64 -d > "$RUNNER_TEMP/tizen-keys/distributor.p12"
          echo "SIGN=1" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: env.SIGN == '1'
        with:
          distribution: temurin
          java-version: 17
      - name: Tizen CLI
        if: env.SIGN == '1'
        env:
          TIZEN_STUDIO: "5.5"
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          wget -q -O "$RUNNER_TEMP/web-cli.bin" \
            "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO}/web-cli_Tizen_Studio_${TIZEN_STUDIO}_ubuntu-64.bin"
          chmod +x "$RUNNER_TEMP/web-cli.bin"
          "$RUNNER_TEMP/web-cli.bin" --accept-license "$HOME/tizen-studio"
          TIZEN="$HOME/tizen-studio/tools/ide/bin/tizen"
          "$TIZEN" version
          "$TIZEN" security-profiles add -n FreeX \
            -a "$RUNNER_TEMP/tizen-keys/author.p12" -p "$AUTHOR_PASSWORD" \
            -d "$RUNNER_TEMP/tizen-keys/distributor.p12" -dp "$DISTRIBUTOR_PASSWORD"
          echo "TIZEN_CLI=$TIZEN" >> "$GITHUB_ENV"
          echo "TIZEN_PROFILE=FreeX" >> "$GITHUB_ENV"
      - name: Build
        run: tizen/build.sh
      - name: Remove the certificate
        if: always()
        run: rm -rf "$RUNNER_TEMP/tizen-keys"
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-tizen
          path: |
            build/FreeX-TV-Tizen-*.zip
            build/FreeX-TV-Tizen-*.wgt

  webos:
    name: LG (webOS)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: webos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-webos
          path: build/*.ipk

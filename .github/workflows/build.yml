# Builds FreeX TV: the Android TV / Fire TV APK, the Samsung (Tizen) project and the LG (webOS)
# package. On a tag v*, all are attached to a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (ES2017, Samsung TVs from 2018 on)
        run: |
          npm install --no-save acorn@8
          node -e '
            const acorn = require("acorn"), fs = require("fs");
            for (const f of fs.readdirSync("web/js")) {
              acorn.parse(fs.readFileSync("web/js/" + f, "utf8"), {ecmaVersion: 2017});
              console.log("ok", f);
            }'

  android:
    name: Android TV / Fire TV
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FREEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/freex.jks"
            echo "FREEX_KEYSTORE=$RUNNER_TEMP/freex.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          FREEX_KEYSTORE_PASSWORD: ${{ secrets.FREEX_KEYSTORE_PASSWORD }}
          FREEX_KEY_ALIAS: ${{ secrets.FREEX_KEY_ALIAS }}
          FREEX_KEY_PASSWORD: ${{ secrets.FREEX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' web/version.json)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FreeX-TV-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-android
          path: dist/*.apk

  tizen:
    name: Samsung (Tizen)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: tizen/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-tizen
          path: build/FreeX-TV-Tizen-*.zip

  webos:
    name: LG (webOS)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: webos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: freex-tv-webos
          path: build/*.ipk

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, tizen, webos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
